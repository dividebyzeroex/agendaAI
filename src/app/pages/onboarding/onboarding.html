<main class="signup-workspace customer-page"><a class="back-link" href="/login"><i class="pi pi-arrow-left" aria-hidden="true"></i>Voltar</a><header class="page-heading"><div><p class="signup-brand">agendaAI</p><h1>Vamos preparar sua agenda.</h1><p>30 dias para testar. Sem cartão e sem cobrança automática.</p></div></header><form (ngSubmit)="finalizar()"><section class="form-section"><label class="field">Nome do negócio<input name="name" [(ngModel)]="form.nome" (ngModelChange)="onNameChange()" required maxlength="150" autocomplete="organization" placeholder="Como seus clientes conhecem seu negócio?"></label><div class="field-row"><label class="field">Tipo de negócio<select name="segment" [(ngModel)]="form.segmento" required><option value="">Selecionar</option><option *ngFor="let s of segmentOptions" [value]="s.value">{{s.label}}</option></select></label><label class="field">Telefone de contato<input name="phone" type="tel" [(ngModel)]="form.telefone" required autocomplete="tel" placeholder="(11) 99999-9999"></label></div><label class="field">Seu link de reservas<span class="helper">{{bookingOrigin}}</span><input name="slug" [(ngModel)]="form.slug" (ngModelChange)="slugEdited=true" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="nome-do-negocio" autocomplete="off"></label></section><details class="disclosure"><summary>Endereço e apresentação <span class="helper">Opcional por enquanto</span></summary><label class="field">Cidade<input name="city" [(ngModel)]="form.cidade" autocomplete="address-level2"></label><label class="field">Endereço<input name="address" [(ngModel)]="form.endereco_completo" autocomplete="street-address"></label><label class="field">CNPJ<input name="cnpj" [(ngModel)]="form.cnpj" inputmode="numeric" maxlength="14"></label><label class="field">Volume de clientes<select name="volume" [(ngModel)]="form.volume_clientes"><option value="">Informar depois</option><option *ngFor="let v of volumeOptions" [value]="v.value">{{v.label}} · {{v.desc}}</option></select></label><label class="field">Cor da sua página<input name="color" type="color" [(ngModel)]="form.cor_primaria"></label></details><div class="signup-terms"><label><input name="terms" type="checkbox" [(ngModel)]="termsAccepted" required><span>Aceito as <a href="/termos" target="_blank" rel="noopener">condições do teste de 30 dias</a>.</span></label><label><input name="marketing" type="checkbox" [(ngModel)]="marketingConsent"><span>Quero receber dicas e ofertas. <span class="helper">Opcional</span></span></label></div><p class="feedback error" *ngIf="errorMessage" role="alert">{{errorMessage}}</p><button class="action signup-submit" type="submit" [disabled]="isSaving||completed">{{isSaving?'Criando sua agenda…':'Criar minha agenda'}}</button><p class="helper">Depois, você cadastra o primeiro serviço e define seus horários.</p></form></main>
