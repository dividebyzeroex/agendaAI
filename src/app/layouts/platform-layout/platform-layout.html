<div class="platform-layout">
  <aside class="sidebar">
    <div class="brand">
      <i class="pi pi-bolt"></i>
      <span>AgendaAI <small>Owner</small></span>
    </div>

    <nav class="nav-menu" aria-label="Navegação principal do Owner">
      <a href="/platform-admin/dashboard" [class.active]="isActive('/platform-admin/dashboard')" [attr.aria-current]="isActive('/platform-admin/dashboard') ? 'page' : null" class="nav-item">
        <i class="pi pi-chart-pie"></i> Visão geral
      </a>
      <a href="/platform-admin/control" [class.active]="isActive('/platform-admin/control')" [attr.aria-current]="isActive('/platform-admin/control') ? 'page' : null" class="nav-item"><i class="pi pi-compass"></i> Gestão e ativação</a>
      <a href="/platform-admin/growth" [class.active]="isActive('/platform-admin/growth')" [attr.aria-current]="isActive('/platform-admin/growth') ? 'page' : null" class="nav-item"><i class="pi pi-users"></i> Oportunidades</a>
      <a href="/platform-admin/tenants" [class.active]="isActive('/platform-admin/tenants')" [attr.aria-current]="isActive('/platform-admin/tenants') ? 'page' : null" class="nav-item">
        <i class="pi pi-building"></i> Estabelecimentos
      </a>
      <a href="/platform-admin/billing" [class.active]="isActive('/platform-admin/billing')" [attr.aria-current]="isActive('/platform-admin/billing') ? 'page' : null" class="nav-item">
        <i class="pi pi-credit-card"></i> Financeiro
      </a>
      <a href="/platform-admin/settings" [class.active]="isActive('/platform-admin/settings')" [attr.aria-current]="isActive('/platform-admin/settings') ? 'page' : null" class="nav-item">
        <i class="pi pi-cog"></i> Configurações
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" *ngIf="user$ | async as user">
        <div class="avatar">{{ user.nome ? user.nome.charAt(0).toUpperCase() : 'S' }}</div>
        <div class="details">
          <strong>{{ user.nome }}</strong>
          <span>Proprietário</span>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()">
        <i class="pi pi-sign-out"></i> Sair
      </button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h2>Seu negócio / Administração</h2>
      <div class="topbar-actions">
        <a href="/" target="_blank" rel="noopener">Abrir site <i class="pi pi-arrow-up-right"></i></a>
        <span class="status-badge"><i class="pi pi-circle-fill"></i> Painel do proprietário</span>
      </div>
    </header>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-support-widget [owner]="true"></app-support-widget>
