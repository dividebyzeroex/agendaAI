name: Signup reliability — full regression
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/app/core/signup-guardrails.ts'
      - 'src/app/pages/login/**'
      - 'src/app/pages/onboarding/**'
      - 'src/app/services/auth.service.ts'
      - 'tests/signup-*.test.ts'
      - 'tests/customer-flow.test.ts'
      - '.github/workflows/signup-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Signup and existing API regressions
        run: npm run test:api
      - name: PostgreSQL integration regressions
        run: npm run test:db
      - name: Backend typecheck
        run: npm run typecheck:api
      - name: Angular production build
        run: npm run build
